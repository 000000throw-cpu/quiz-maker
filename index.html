  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dynamic Quiz Project</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="stylesheet.css">

  <script src="jsquiz.js" defer></script>
</head>

<body>
  <main id="container">

    <header id="title">
      <h1>Dynamic Quiz</h1>
      <p>Test your knowledge and track your progress.</p>
    </header>
<!-- QUIZ SELECTION MENU -->
<div id="quiz-selection">
  <h2>Choose a Quiz</h2>
  <p>Select a subject to begin.</p>

  <div id="quiz-list"></div>
</div>
<!-- Back to Quizzes navigation -->
<div id="quiz-top-navigation" style="display: none;">
  <button id="back-to-quizzes-top" type="button">
    <span aria-hidden="true">←</span> Back to Quizzes
  </button>
</div>
<!-- QUIZ CONTENT -->
<div id="quiz"></div>
    <section
      id="quiz"
      aria-label="Quiz questions"
      aria-live="polite">
    </section>

    <nav class="quiz-navigation" aria-label="Quiz navigation">

      <button
        type="button"
        class="button"
        id="prev">
        Previous
      </button>

      <button
        type="button"
        class="button"
        id="next">
        Next
      </button>

      <button
        type="button"
        class="button"
        id="start">
        Start Over
      </button>

    </nav>

  </main>
</body>
</html>
    <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script><script  src="./script.js"></script>

  </body>
  
</html>
